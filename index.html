<!DOCTYPE html>
<html lang="es" class="bg-white">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nexi · Catálogo de Fibra Óptica | EEPSA</title>
    <meta
      name="description"
      content="Habla con Nexi, el asistente de EEPSA, para encontrar el equipo de fibra óptica OpticTimes ideal para tu proyecto."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              teal: {
                50: "#eef7f6",
                100: "#dcefec",
                200: "#b9e0d9",
                300: "#8ecdc2",
                400: "#5fb3a6",
                500: "#38958d",
                600: "#2f7f78",
                700: "#256560",
                800: "#1c4d49",
                DEFAULT: "#38958d",
              },
              ink: {
                DEFAULT: "#0f172a",
                muted: "#475569",
              },
              line: "#e2e8f0",
            },
            fontFamily: {
              sans: ["DM Sans", "ui-sans-serif", "system-ui", "sans-serif"],
            },
          },
        },
      };
    </script>
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body class="text-ink antialiased">
    <div class="nexi-bg min-h-dvh w-full">
      <div class="mx-auto flex min-h-dvh w-full max-w-2xl flex-col sm:py-6">
        <div class="relative flex h-dvh w-full flex-col overflow-hidden bg-white sm:h-[calc(100dvh-3rem)] sm:max-h-[880px] sm:rounded-3xl sm:border sm:border-white/60 sm:shadow-2xl">
          <!-- Header -->
          <header class="glass-strong sticky top-0 z-20 flex items-center justify-between border-b border-line/70 px-4 py-3 sm:px-5">
            <div class="flex items-center gap-3">
              <div class="relative flex size-10 shrink-0 items-center justify-center overflow-hidden rounded-full bg-[#f3f4f6] ring-2 ring-teal-500/30">
                <img src="assets/nexi-avatar.jpg" alt="Nexi" class="h-full w-full object-cover" />
                <span class="nexi-online-dot absolute -bottom-0.5 -right-0.5 size-3 rounded-full bg-emerald-500 ring-2 ring-white"></span>
              </div>
              <div class="flex flex-col">
                <span class="font-heading text-sm font-semibold text-ink">Nexi</span>
                <span class="flex items-center gap-1.5 text-xs text-ink-muted">
                  <span class="size-1.5 rounded-full bg-teal-500"></span>
                  Asistente de EEPSA · en línea
                </span>
              </div>
            </div>
            <button
              type="button"
              id="cart-trigger"
              class="flex cursor-pointer items-center gap-2 rounded-full border border-line bg-white/70 px-3 py-1.5 text-sm font-semibold text-ink transition-colors hover:border-teal-500/50"
              aria-haspopup="dialog"
              aria-expanded="false"
            >
              <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#38958d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="8" height="4" x="8" y="2" rx="1" ry="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><path d="M12 11h4"/><path d="M12 16h4"/><path d="M8 11h.01"/><path d="M8 16h.01"/></svg>
              <span id="cart-count">0</span>
              <span class="sr-only">Ver mi solicitud</span>
            </button>
          </header>

          <!-- Messages -->
          <div id="scroll" class="flex-1 overflow-y-auto px-4 py-6 sm:px-5">
            <div class="flex flex-col gap-5">
              <!-- Greeting -->
              <div class="flex items-start gap-3">
                <div class="relative flex size-10 shrink-0 items-center justify-center overflow-hidden rounded-full bg-[#f3f4f6] ring-2 ring-teal-500/30">
                  <img src="assets/nexi-avatar.jpg" alt="Nexi" class="h-full w-full object-cover" />
                </div>
                <div class="max-w-[85%] rounded-2xl rounded-tl-sm border border-line bg-white px-4 py-3 text-sm leading-relaxed text-ink shadow-sm">
                  ¡Hola! Soy <span class="font-semibold text-teal-600">Nexi</span>, tu asistente en EEPSA. Te ayudo a
                  encontrar el equipo de fibra óptica ideal de la marca <span class="font-semibold">OpticTimes</span>.
                </div>
              </div>

              <!-- Question -->
              <div class="flex items-start gap-3">
                <div class="relative flex size-10 shrink-0 items-center justify-center overflow-hidden rounded-full bg-[#f3f4f6] ring-2 ring-teal-500/30">
                  <img src="assets/nexi-avatar.jpg" alt="Nexi" class="h-full w-full object-cover" />
                </div>
                <div class="max-w-[85%] rounded-2xl rounded-tl-sm border border-line bg-white px-4 py-3 text-sm leading-relaxed text-ink shadow-sm">
                  Para empezar, ¿qué tipo de producto buscas? Elige una categoría y te muestro las opciones.
                </div>
              </div>

              <!-- Category grid (primary category filter) -->
              <div id="category-card" class="ml-[52px] max-w-[88%] rounded-2xl glass border border-white/60 p-4 shadow-sm sm:p-5">
                <div id="category-grid" class="grid grid-cols-2 gap-3"></div>
              </div>

              <!-- Dynamic conversation gets appended here -->
              <div id="conversation" class="flex flex-col gap-5"></div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Order / cart bottom sheet -->
    <div id="cart-overlay" class="nexi-overlay pointer-events-none fixed inset-0 z-30 bg-ink/40 opacity-0" aria-hidden="true"></div>
    <div
      id="cart-panel"
      class="nexi-sheet nexi-sheet-hidden glass-strong fixed inset-x-0 bottom-0 z-40 mx-auto w-full max-w-2xl rounded-t-3xl border border-white/60 shadow-2xl"
      role="dialog"
      aria-modal="true"
      aria-labelledby="cart-title"
    >
      <div class="flex items-center justify-between border-b border-line/70 px-5 py-4">
        <h2 id="cart-title" class="font-heading text-base font-semibold text-ink">Tu solicitud</h2>
        <button type="button" id="cart-close" class="cursor-pointer rounded-full p-1.5 text-ink-muted transition-colors hover:bg-black/5" aria-label="Cerrar">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
        </button>
      </div>
      <div id="cart-body" class="max-h-[70vh] overflow-y-auto px-5 py-4"></div>
    </div>

    <script src="js/data.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
